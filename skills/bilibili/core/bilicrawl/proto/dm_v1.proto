// Danmaku segment protobuf schema.
//
// Source: https://github.com/SocialSisterYi/bilibili-API-collect
//         (grpc_api/bilibili/community/service/dm/v1/dm.proto)
// Endpoint: GET https://api.bilibili.com/x/v2/dm/web/seg.so
//
// Regenerate the Python bindings with:  uv run python scripts/gen_proto.py
// The generated file is checked in and pinned to the protobuf runtime in
// pyproject.toml; generated-by-newer-than-runtime fails at import.

syntax = "proto3";

package bilibili.community.service.dm.v1;

// Response for one 6-minute (360s) danmaku segment.
message DmSegMobileReply {
    // Danmaku entries in this segment.
    repeated DanmakuElem elems = 1;
    // Danmaku state: 0 = open, 1 = closed.
    int32 state = 2;
    // AI cloud-filter scores (unused by this tool).
    DanmakuAIFlag ai_flag = 3;
    // Special colorful danmaku sources (unused by this tool).
    repeated DmColorful colorfulSrc = 5;
}

// One danmaku entry.
message DanmakuElem {
    // Danmaku id (numeric).
    int64 id = 1;
    // Display position in milliseconds.
    int32 progress = 2;
    // Type: 1-3 scroll, 4 bottom, 5 top, 6 reverse, 7 advanced, 8 code, 9 BAS.
    int32 mode = 3;
    // Font size.
    int32 fontsize = 4;
    // Color as packed RGB.
    uint32 color = 5;
    // Sender mid hash.
    string midHash = 6;
    // Text content.
    string content = 7;
    // Send time (unix seconds).
    int64 ctime = 8;
    // Weight in [1, 10].
    int32 weight = 9;
    // Action.
    string action = 10;
    // Pool: 0 normal, 1 subtitle, 2 special.
    int32 pool = 11;
    // Danmaku id as string.
    string idStr = 12;
    // Attribute bits: bit0 protected, bit1 live, bit2 upvoted.
    int32 attr = 13;
    // Animation.
    string animation = 22;
}

message DanmakuAIFlag {
    repeated DanmakuFlag dm_flags = 1;
}

message DmColorful {
    int32 type = 1;
    string src = 2;
}

message DanmakuFlag {
    int64 dmid = 1;
    uint32 flag = 2;
}
